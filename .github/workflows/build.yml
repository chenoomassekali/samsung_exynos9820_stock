name: Build NetHunter Kernel for d2s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Clone NetHunter builder
        run: git clone https://github.com/ravindu644/kali-nethunter-kernel.git

      - name: Clone and integrate KernelSU
        run: |
          cd ${{ github.workspace }}
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/tiann/KernelSU.git
          mv KernelSU/kernel drivers/kernelsu
          rm -rf KernelSU

      - name: Prepare defconfig for NetHunter
        run: |
          # Simpan path root kernel di variabel
          KROOT=${{ github.workspace }}
          echo "Kernel root is: $KROOT"
          
          # Salin defconfig bawaan d2s menjadi nethunter_defconfig
          cp ${KROOT}/arch/arm64/configs/exynos9820-d2s_defconfig ${KROOT}/arch/arm64/configs/nethunter_defconfig
          echo "Copied defconfig to nethunter_defconfig"

      - name: Configure and build
        run: |
          KROOT=${{ github.workspace }}
          export TERM=xterm
          
          cd kali-nethunter-kernel
          
          # Buat local.config untuk menimpa pengaturan default builder
          cat > local.config << 'EOF'
          ARCH=arm64
          SUBARCH=arm64
          KDIR=${{ github.workspace }}
          CONFIG=exynos9820-d2s_defconfig
          DEVICE=d2s
          NH_VERSION=2025.3
          CC=clang
          EOF
          
          echo "Starting non-interactive build..."
          # Kirim pilihan 2 (Configure & compile) lalu jawab "N" untuk "Edit config?"
          { echo "2"; echo "N"; } | bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-d2s-OneUI4.1-boot
          path: kali-nethunter-kernel/output/*.img
