name: Build NetHunter Kernel for d2s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Clone NetHunter builder
        run: git clone https://github.com/ravindu644/kali-nethunter-kernel.git

      - name: Clone and integrate KernelSU
        run: |
          cd ${{ github.workspace }}
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/tiann/KernelSU.git
          mv KernelSU/kernel drivers/kernelsu
          rm -rf KernelSU

      - name: Prepare defconfig for NetHunter
        run: |
          KROOT=${{ github.workspace }}
          # Salin defconfig d2s yang benar (exynos9825-d2s) menjadi nethunter_defconfig
          cp ${KROOT}/arch/arm64/configs/exynos9825-d2s_defconfig ${KROOT}/arch/arm64/configs/nethunter_defconfig

      - name: Configure and build
        run: |
          export TERM=xterm
          export ANDROID_MAJOR_VERSION=12  # One UI 4.1 = Android 12
          
          cd kali-nethunter-kernel
          
          # Override semua konfigurasi builder via local.config
          cat > local.config << 'EOF'
          ARCH=arm64
          SUBARCH=arm64
          KDIR=${{ github.workspace }}
          CONFIG=exynos9825-d2s_defconfig
          DEVICE=d2s
          NH_VERSION=2025.3
          CC=clang
          EOF
          
          # Jalankan build secara non-interaktif: pilih mode 2 (kompilasi penuh) dan tolak edit config
          echo -e "2\nN" | bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-d2s-OneUI4.1-boot
          path: kali-nethunter-kernel/output/*.img
